<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>calc()でオフセットを加えた配置</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
    }

    .anchor {
      anchor-name: --my-anchor;
      padding: 12px 24px;
      background-color: #1a73e8;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
    }

    .target {
      position: absolute;
      position-anchor: --my-anchor;
      top: anchor(top);
      left: calc(anchor(right) + 10px);
      padding: 12px 24px;
      background-color: #6f42c1;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="anchor">アンカー要素</div>
  <div class="target">配置される要素（10px右にずれている）</div>
</body>
</html>
