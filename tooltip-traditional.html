<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Anchor Positioningを使わないツールチップ</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
    }

    .button-wrapper {
      position: relative;
      display: inline-block;
    }

    .button {
      width: fit-content;
      padding: 8px 16px;
      background-color: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: default;
    }

    .tooltip {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      translate: -50% 0;
      padding: 8px 16px;
      background-color: #333;
      color: #fff;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* 吹き出しの三角（上向き） */
    .tooltip::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      translate: -50% 0;
      border: 6px solid transparent;
      border-top: none;
      border-bottom-color: #333;
    }
  </style>
</head>
<body>
  <div class="button-wrapper">
    <button class="button" type="button">ボタン</button>
    <div class="tooltip">ツールチップのテキストが入ります</div>
  </div>
</body>
</html>
