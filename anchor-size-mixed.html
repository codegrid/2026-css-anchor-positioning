<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>アンカーのwidthを基準に縦横を計算する</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      margin: 0;
      font-family: sans-serif;
      min-height: 100dvh;
      background-color: #f5f5f5;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background-color: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .anchor {
      anchor-name: --my-anchor;
      width: var(--anchor-width, 80px);
      height: 40px;
      background-color: #1a73e8;
      border-radius: 4px;
    }

    .tooltip {
      position: absolute;
      position-anchor: --my-anchor;
      position-area: center right;
      width: calc(anchor-size(width) * 3);
      height: calc(anchor-size(width) * 2);
      margin-left: 16px;
      padding: 12px 16px;
      background-color: #333;
      color: #fff;
      border-radius: 4px;
      font-size: 0.875rem;
      overflow: auto;
    }

    .tooltip::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 50%;
      translate: 0 -50%;
      border: 6px solid transparent;
      border-left: none;
      border-right-color: #333;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label for="width-range">アンカーの幅：</label>
    <input id="width-range" type="range" min="60" max="120" value="80" step="10">
    <output id="width-output">80px</output>
  </div>
  <div class="anchor"></div>
  <div class="tooltip">
    <p>widthとheightはどちらもアンカーのwidthを基準に計算されています。</p>
  </div>
  <script>
    const range = document.getElementById('width-range');
    const output = document.getElementById('width-output');
    range.addEventListener('input', () => {
      document.documentElement.style.setProperty('--anchor-width', `${range.value}px`);
      output.textContent = `${range.value}px`;
    });
  </script>
</body>
</html>
