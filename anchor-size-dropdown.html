<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ドロップダウンメニュー</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      margin: 0;
      font-family: sans-serif;
      min-height: 100dvh;
      background-color: #f5f5f5;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background-color: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .preset {
      padding: 4px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .preset:hover {
      background-color: #f0f0f0;
    }

    .preset.is-active {
      background-color: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }

    .button {
      anchor-name: --dropdown-anchor;
      padding: 8px 16px;
      background-color: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .menu {
      position-anchor: --dropdown-anchor;
      position-area: bottom span-right;
      width: anchor-size(width);
      margin: 4px 0 0;
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      list-style: none;
      padding: 4px 0;
    }

    .menu li a {
      display: block;
      padding: 8px 16px;
      color: #333;
      text-decoration: none;
      font-size: 0.875rem;
    }

    .menu li a:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <button class="button" popovertarget="menu">
    <span class="label">標準のラベル</span> <span>▾</span>
  </button>
  <ul class="menu" id="menu" popover>
    <li><a href="#">プロフィール</a></li>
    <li><a href="#">設定</a></li>
    <li><a href="#">ログアウト</a></li>
  </ul>
  <div class="controls">
    <span>ボタンのラベル：</span>
    <button class="preset" data-label="短め">短め</button>
    <button class="preset is-active" data-label="標準のラベル">標準</button>
    <button class="preset" data-label="とても長いラベルのボタン">長め</button>
  </div>
  <script>
    const label = document.querySelector('.label');
    const presets = document.querySelectorAll('.preset');
    presets.forEach(preset => {
      preset.addEventListener('click', () => {
        label.textContent = preset.dataset.label;
        presets.forEach(p => p.classList.remove('is-active'));
        preset.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
